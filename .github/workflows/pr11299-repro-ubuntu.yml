# Disposable repro workflow. Delete after validation.

name: "PR 11299 hub-upload A/B (ubuntu-latest)"

on:
  push:
    branches:
      - "pr-11299-repro-mimir-skill-e2e-pr-11299-20260919221545"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install pytest"
        shell: bash
        run: |
          python -m pip install --upgrade pip && python -m pip install pytest

      - name: "NEGATIVE: the four new tests must fail against main's export.py"
        shell: bash
        run: |
          git checkout 768d644036a948441ba80b626c9e747c1fecfbae -- studio/backend/core/export/export.py
          cd studio/backend
          set +e
          python -m pytest tests/test_export_hub_push.py -p no:randomly -q -k "metadata_out_of_the_repo or does_not_upload_its_leftovers or uploads_the_saved_folder" > "$RUNNER_TEMP/negative.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/negative.txt"
          if [ "$rc" -eq 0 ]; then echo "FAIL repro: the tests passed without the fix"; exit 1; fi
          grep -q "4 failed" "$RUNNER_TEMP/negative.txt" || { echo "FAIL repro: expected exactly 4 failures"; exit 1; }
          echo "PASS negative: 4 tests reproduce the bug on main"

      - name: "Restore the PR's export.py"
        shell: bash
        run: |
          git checkout HEAD -- studio/backend/core/export/export.py

      - name: "POSITIVE: the whole hub-push suite must pass with the fix"
        shell: bash
        run: |
          cd studio/backend
          python -m pytest tests/test_export_hub_push.py tests/test_export_gguf_hub_upload.py -p no:randomly -q
          echo "PASS positive: hub-push suite green with the fix"

