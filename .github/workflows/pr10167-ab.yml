name: PR 10167 OAuth client_id A/B

on:
  push:
    branches:
      - 'mimir-pr10167-**'

permissions:
  contents: read

jobs:
  repro:
    name: MCP OAuth client_secret_basic regression test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install the SDKs at the versions studio.txt pins
        run: |
          python -m pip install --upgrade pip
          pip install 'fastmcp>=3.0.2' 'mcp>=1.24,<2' pytest pytest-asyncio httpx

      - name: Record the exact SDK versions under test
        run: |
          python - <<'PY'
          import importlib.metadata as md
          for name in ("fastmcp", "mcp", "httpx", "pytest"):
              print(f"VERSION {name}=={md.version(name)}")
          PY

      - name: Show whether the production fix is present in this tree
        run: |
          if grep -q "_strip_client_id_under_basic_auth" studio/backend/core/inference/mcp_client.py; then
            echo "TREE=with-fix (mcp_client.py contains _strip_client_id_under_basic_auth)"
          else
            echo "TREE=no-fix (mcp_client.py does NOT contain _strip_client_id_under_basic_auth)"
          fi

      - name: Run the OAuth regression test
        working-directory: studio/backend
        run: pytest tests/test_mcp_oauth_basic_auth.py -v -p no:cacheprovider
