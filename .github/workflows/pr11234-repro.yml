# Disposable repro workflow. Delete after validation.

name: "PR 11234 settings Off persistence (A/B)"

on:
  push:
    branches:
      - "mimir-pr11234-ci-20260917211243"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Backend: settings payload tests (incl. Off round-trip + bool guard)"
        shell: bash
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q pytest==8.4.2 pytest-timeout 'httpx>=0.27.0'
          python -m pip install -q -r studio/backend/requirements/studio.txt
          cd studio/backend
          python -m pytest -q --timeout=600 tests/test_chat_settings_payload.py
          echo 'PASS backend settings payload suite'

      - name: "Backend: negative control -- revert the bool guard, the guard test must FAIL"
        shell: bash
        run: |
          cd studio/backend
          python - <<'PY'
          import pathlib
          p=pathlib.Path('routes/chat_history.py'); s=p.read_text()
          b='@field_validator("researchModelTimeoutSeconds", "maxToolCallsPerMessage", mode = "before")'
          a='@field_validator("researchModelTimeoutSeconds", mode = "before")'
          assert s.count(b)==1
          p.write_text(s.replace(b,a))
          PY
          if python -m pytest -q --timeout=600 tests/test_chat_settings_payload.py::test_max_tool_calls_rejects_a_boolean; then echo 'FAIL negative control passed unexpectedly'; exit 1; else echo 'PASS negative control failed as intended'; fi
          git checkout -- routes/chat_history.py

      - name: "Frontend: max-tool-calls Off persistence test"
        shell: bash
        run: |
          cd studio/frontend
          npm ci --no-audit --no-fund 2>&1 | tail -5 || npm install --no-audit --no-fund 2>&1 | tail -5
          node --experimental-strip-types --test tests/max-tool-calls-off-persists.test.ts
          echo 'PASS frontend Off-persistence test'

      - name: "Frontend: negative control -- restore the floor of 1, Off must be dropped"
        shell: bash
        run: |
          cd studio/frontend
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('src/features/chat/utils/chat-settings-storage.ts'); s=p.read_text()
          for b,a in (("sanitizeInt(value.maxToolCallsPerMessage, 0)","sanitizeInt(value.maxToolCallsPerMessage, 1)"),("loadInt(MAX_TOOL_CALLS_KEY, 0)","loadInt(MAX_TOOL_CALLS_KEY, 1)")):
              assert s.count(b)==1, b
              s=s.replace(b,a)
          p.write_text(s)
          PY
          if node --experimental-strip-types --test tests/max-tool-calls-off-persists.test.ts; then echo 'FAIL negative control passed unexpectedly'; exit 1; else echo 'PASS frontend negative control failed as intended'; fi
          git checkout -- src/features/chat/utils/chat-settings-storage.ts

