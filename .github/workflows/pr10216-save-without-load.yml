# Disposable repro workflow. Delete after validation.

name: "PR 10216 repro: save run settings without loading"

on:
  push:
    branches:
      - "pr10216-repro-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Repro env"
        shell: bash
        run: |
          echo "HF_HOME=${GITHUB_WORKSPACE}/hf-cache" >> "$GITHUB_ENV"
          echo "GGUF_REPO=unsloth/gemma-3-270m-it-GGUF" >> "$GITHUB_ENV"
          echo "GGUF_VARIANT=UD-Q4_K_XL" >> "$GITHUB_ENV"
          echo "GGUF_FILE=gemma-3-270m-it-UD-Q4_K_XL.gguf" >> "$GITHUB_ENV"
          echo "STUDIO_REPRO_PORT=18899" >> "$GITHUB_ENV"
          mkdir -p logs

      - name: "Linux deps"
        shell: bash
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq || { apt-get update && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq; }'

      - name: "Prime HF_HOME with the GGUF (never loaded, only cached)"
        shell: bash
        run: |
          python -m pip install --quiet --upgrade huggingface_hub
          mkdir -p "$HF_HOME"
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE"
          ls -R "$HF_HOME" | head -20

      - name: "Install Unsloth (--local, --no-torch)"
        # Same two tokens .github/actions/install-unsloth-local passes: GH_TOKEN for the
        # llama.cpp release lookup, HF_TOKEN unset (the GGUF here is public, and this
        # branch is a disposable restage of PR code).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          bash install.sh --local --no-torch 2>&1 | tee logs/install.log

      - name: "Install Playwright chromium"
        shell: bash
        run: |
          python -m pip install --quiet 'playwright>=1.45,<2'
          python -m playwright install --with-deps chromium

      - name: "Boot Unsloth Studio"
        shell: bash
        run: |
          bash .github/scripts/boot-studio-api-only.sh \
            --port "$STUDIO_REPRO_PORT" --log logs/studio_repro.log --pid-var STUDIO_REPRO_PID

      - name: "Wait for /api/health"
        shell: bash
        run: |
          bash .github/scripts/wait-for-health.sh \
            --port "$STUDIO_REPRO_PORT" --log logs/studio_repro.log --tmp /tmp/health_repro.json

      - name: "Mint the bootstrap password for the probe"
        shell: bash
        run: |
          NEW="PR10216-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          echo "::add-mask::$NEW"
          echo "STUDIO_REPRO_NEW_PW=$NEW" >> "$GITHUB_ENV"

      - name: "PR 10216 probe: save run settings without loading the model"
        shell: bash
        run: |
          mkdir -p logs/playwright_save_without_load
          BASE_URL="http://127.0.0.1:${STUDIO_REPRO_PORT}" \
          STUDIO_NEW_PW="$STUDIO_REPRO_NEW_PW" \
          PW_ART_DIR=logs/playwright_save_without_load \
          GGUF_REPO="$GGUF_REPO" \
          GGUF_VARIANT="$GGUF_VARIANT" \
          STUDIO_MODEL_HINT=gemma-3-270m \
          STUDIO_DISTINCT_CTX=4096 \
          python tests/studio/pr10216_save_without_load_probe.py

      - name: "Stop Studio"
        if: always()
        shell: bash
        run: |
          kill "${STUDIO_REPRO_PID}" 2>/dev/null || true
          sleep 2
          tail -40 logs/studio_repro.log || true

      - name: "Upload probe artifacts"
        # Same reason as the stop step: the negative branch is expected to fail, and
        # its screenshots and diagnostics are the evidence.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pr10216-${{ github.ref_name }}
          path: |
            logs/playwright_save_without_load/**
            logs/studio_repro.log
            logs/install.log
          if-no-files-found: warn
          retention-days: 7
