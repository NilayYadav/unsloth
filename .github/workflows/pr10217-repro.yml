# SPDX-License-Identifier: AGPL-3.0-only
# Disposable reproduction harness for unslothai/unsloth PR #10217. Branch-scoped.
name: PR 10217 audio auto-switch repro

on:
  push:
    branches:
      - 'pr10217-repro-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr10217-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ab-probe:
    name: A/B - does the named model reach the switch hook
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install backend test dependencies (same shape as studio-backend-ci)
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install \
            python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests \
            'numpy<3' pytest pytest-asyncio pytest-timeout httpx \
            soundfile librosa
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            'torch>=2.4,<2.11' 'torchaudio<2.11'
          pip install 'transformers>=4.51,<5.5'
          pip install "$(grep -m1 -E '^peft==' studio/backend/requirements/extras-no-deps.txt)"

      - name: POSITIVE - PR 10217 implementation, probe must fully pass
        working-directory: studio/backend
        run: |
          set -o pipefail
          python -m pytest tests/test_pr10217_probe.py -q -s --timeout=300 2>&1 | tee ../../positive.txt

      - name: Revert ONLY the implementation to merge base c9f98dbd (probe untouched)
        run: |
          git checkout c9f98dbd5e3ff4b620067cfbcf28fc29311f6396 -- \
            studio/backend/routes/inference.py \
            studio/backend/models/inference.py \
            studio/backend/utils/audio_tokens.py \
            studio/backend/utils/models/gguf_metadata.py
          echo "--- files now differing from the PR head ---"
          git status --porcelain
          echo "--- probe file is unchanged from the PR head ---"
          git diff --quiet HEAD -- studio/backend/tests/test_pr10217_probe.py && echo "probe identical: OK"

      - name: NEGATIVE - main implementation, probe must fail at A, C and E only
        working-directory: studio/backend
        run: |
          set +e
          # pipefail matters: without it rc captures tee's status, not pytest's,
          # and the A/B validation below reads a green negative run that never happened.
          set -o pipefail
          python -m pytest tests/test_pr10217_probe.py -q -s --timeout=300 2>&1 | tee ../../negative.txt
          rc=$?
          set -e
          echo "negative pytest exit code: $rc"
          if [ "$rc" -eq 0 ]; then
            echo "A/B INVALID: the probe passed against main, so it proves nothing."
            exit 1
          fi
          python - <<'PY'
          import re, sys
          out = open("../../negative.txt").read()
          failed = set(re.findall(r"FAILED tests/test_pr10217_probe\.py::test_([A-E])_", out))
          expected = {"A", "C", "E"}
          print("negative failures:", sorted(failed))
          if failed != expected:
              print(f"A/B INVALID: expected exactly {sorted(expected)} to fail, got {sorted(failed)}")
              sys.exit(1)
          if "assert '\\x00reload-only' == 'org/B-GGUF'" not in out and "reload-only" not in out:
              print("A/B INVALID: the failure is not the reload-only sentinel this PR removes.")
              sys.exit(1)
          print("A/B VALID: on main the named model is dropped for the reload-only sentinel;")
          print("           the two no-model controls (B, D) passed on both sides.")
          PY

      - name: Upload A/B logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pr10217-ab-logs
          path: |
            positive.txt
            negative.txt

  real-gguf:
    name: Real published GGUFs - does the new probe classify them
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the only two imports this probe pulls in
        run: pip install structlog pyyaml

      - name: Classify real Hugging Face GGUF headers with read_gguf_tts_audio_type
        working-directory: studio/backend
        run: |
          python - <<'PY'
          import sys, time, urllib.request
          sys.path.insert(0, ".")
          from utils.models.gguf_metadata import read_gguf_tts_audio_type, _parse_gguf_marker_tokens

          # (repo, file, expected verdict). Only the first 32 MiB is fetched: the GGUF
          # metadata block that carries tokenizer.ggml.tokens sits at the head of the file.
          # The verdict each model's vocabulary should draw, matching what
          # LlamaCppBackend._detect_audio_type_strict would report after the load.
          CASES = [
              ("unsloth/orpheus-3b-0.1-ft-GGUF", "orpheus-3b-0.1-ft-Q2_K.gguf", "snac"),
              ("mradermacher/Spark-TTS-0.5B-GGUF", "Spark-TTS-0.5B.Q2_K.gguf", "bicodec"),
              ("OuteAI/Llama-OuteTTS-1.0-1B-GGUF", "Llama-OuteTTS-1.0-1B-Q2_K.gguf", "dac"),
              # 0.2 ships DAC's four delimiters but neither codebook token, so llama.cpp
              # will not serve it as audio. Accepting it here would evict for nothing.
              ("OuteAI/OuteTTS-0.2-500M-GGUF", "OuteTTS-0.2-500M-Q2_K.gguf", None),
              ("unsloth/Qwen3-0.6B-GGUF", "Qwen3-0.6B-Q2_K.gguf", None),
              ("unsloth/Llama-3.2-1B-Instruct-GGUF", "Llama-3.2-1B-Instruct-Q2_K.gguf", None),
          ]
          MIB = 32 * 1024 * 1024
          bad = []
          print(f"{'model':<46} {'markers':>8} {'snac?':>6} {'verdict':>10} {'expected':>10} {'ms':>7}  result")
          for repo, fname, expected in CASES:
              url = f"https://huggingface.co/{repo}/resolve/main/{fname}"
              req = urllib.request.Request(url, headers={"Range": f"bytes=0-{MIB - 1}"})
              with urllib.request.urlopen(req, timeout=300) as r, open(fname, "wb") as f:
                  f.write(r.read())
              parsed = _parse_gguf_marker_tokens(fname)
              t = time.perf_counter()
              got = read_gguf_tts_audio_type(fname)
              ms = (time.perf_counter() - t) * 1000
              ok = got == expected
              if not ok:
                  bad.append((repo, got, expected))
              # (marker tokens, whether the ids the SNAC probe reads are codec codes)
              n = len(parsed[0]) if parsed is not None else -1
              snac = "yes" if parsed is not None and parsed[1] else "no"
              print(f"{repo:<46} {n:>8} {snac:>6} {str(got):>10} {str(expected):>10} {ms:>7.1f}  {'PASS' if ok else 'FAIL'}")
              import os
              os.remove(fname)
          if bad:
              print("FAIL:", bad)
              sys.exit(1)
          print()
          print("PASS: every verdict matches what llama.cpp would report after loading the model.")
          PY
