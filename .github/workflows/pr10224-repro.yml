# Disposable repro workflow. Delete after validation.

name: "PR 10224 Apple unified free VRAM repro"

on:
  push:
    branches:
      - "mimir-pr10224-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "macos-15"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Environment"
        shell: bash
        run: |
          set -eux
          sw_vers
          uname -m
          python3 -VV
          sysctl -n hw.memsize
          git log --oneline -3

      - name: "Install probe dependencies"
        shell: bash
        run: |
          set -eux
          python3 -m pip install --upgrade pip
          python3 -m pip install psutil structlog mlx
          python3 -m pip freeze | grep -Ei '^(mlx|psutil|structlog)' 

      - name: "Probe identity (must be byte-identical on both branches)"
        shell: bash
        run: |
          set -eux
          shasum -a 256 pr10224_probe.py

      - name: "PR 10224 repro probe"
        shell: bash
        run: |
          set -eux
          python3 pr10224_probe.py

