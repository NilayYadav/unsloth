# Disposable repro workflow. Delete after validation.

name: "PR 9719 multi-image repro"

on:
  push:
    branches:
      - "mimir-repro-pr9719-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: "Install the backend import chain (no torch: this path never reaches it)"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 requests 'numpy<3' httpx pillow

      - name: "PR 9719 probe: multi-image message and per-turn image selection"
        shell: bash
        run: |
          python .github/pr9719/probe.py

