name: load-bench
on:
  push:
    branches: ["bench/load-fix"]
permissions:
  contents: read
jobs:
  load:
    strategy:
      fail-fast: false
      matrix:
        runner: [a, b]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Long-thread load time, WebKit, arms interleaved (3 rounds, Glass off and on)
        env:
          BENCH_WORK: ${{ runner.temp }}/lagbench
          LOAD_ARMS: at16902=bench/at16902,main-now=bench/main-now,fix=bench/main-now+fix.patch,fixjump=bench/main-now+fixjump.patch
          LOAD_ROUNDS: "3"
          LOAD_TURNS: "1 150"
          LOAD_ENGINE: webkit
          LOAD_MATERIALS: solid,glass
        run: |
          mkdir -p job/out
          cp bench/pack_menus.tgz job/
          cd job
          python -u ../bench/run_all.py load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-${{ matrix.runner }}
          path: job/out
