# Disposable repro workflow. Delete after validation.

name: "PR 13479 Laya macos-14"

on:
  push:
    branches:
      - "pr13479-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "macos-14"
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install backend test deps (CPU torch)"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 mammoth unpdf requests 'numpy<3' pytest pytest-asyncio pytest-timeout httpx
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11'
          pip install 'transformers>=4.51,<=5.17.0'
          pip install "$(grep -m1 -E '^peft==' studio/backend/requirements/extras-no-deps.txt)"

      - name: "Laya device default and worker tests"
        shell: bash
        run: |
          cd studio/backend
          python -c "import sys,platform; print('PLATFORM', sys.platform, platform.machine())"
          python -m pytest -q --tb=short --timeout=600 -rs tests/test_systemone.py tests/test_decision_serving.py 2>&1 | tee ../../laya-tests.txt
          echo "PYTEST_EXIT ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

