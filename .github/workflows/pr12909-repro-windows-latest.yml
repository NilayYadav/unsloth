# Disposable repro workflow. Delete after validation.

name: "PR 12909 vision question column (windows-latest)"

on:
  push:
    branches:
      - "pr12909-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "windows-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install test deps"
        shell: bash
        run: |
          python -m pip install -q datasets pillow pytest pyyaml structlog fastapi pydantic httpx

      - name: "Run the vision question column tests"
        shell: bash
        run: |
          cd studio/backend
          python -m pytest -v -p no:cacheprovider tests/test_vlm_question_column.py

