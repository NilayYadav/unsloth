name: menus-bench
on:
  push:
    branches: ["bench/menus-ci", "bench/webkit-close"]
permissions:
  contents: read
jobs:
  menus:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record arm refs
        run: |
          mkdir -p job/out
          git ls-remote https://github.com/danielhanchen/unsloth-staging-2 "refs/heads/bench/wo-*" | tee job/out/arm_ref.txt
      - name: Menu bench, base vs fix on one runner (1-turn vs 150-turn thread, Solid)
        env:
          BENCH_WORK: ${{ runner.temp }}/lagbench
          MENU_ARM_REFS: wo-base=bench/wo-base,wo-fix=bench/wo-fix
          MENU_GLASS: "0"
          MENU_REPS: "2"
          MENU_TURNS: "1 150"
          MENU_ENGINES: webkit
        run: |
          cp bench/pack_menus.tgz job/
          cd job
          python -u ../bench/run_all.py menus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menus-${{ matrix.os }}-wo
          path: job/out
