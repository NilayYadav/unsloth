# Disposable repro workflow. Delete after validation.

name: "PR 11225 converged evidence"

on:
  push:
    branches:
      - "mimir-pr11225-converged-20260917223121"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Fetch the A/B base and the PR as first submitted"
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 062e643086311fc6c276de2a93afcd3e85259796
          git fetch --no-tags --depth=1 origin 3970c93c3c190635d6e51408968c7972ece0f9cd
          git worktree add --detach /tmp/pr11225_base 062e643086311fc6c276de2a93afcd3e85259796
          git worktree add --detach /tmp/pr11225_v1 3970c93c3c190635d6e51408968c7972ece0f9cd

      - name: "The defect on the base: one cloudflared run, hard error"
        shell: bash
        run: |
          python3 .github/repro/pr11225_probe.py /tmp/pr11225_base before

      - name: "The fix at HEAD: retries and comes online"
        shell: bash
        run: |
          python3 .github/repro/pr11225_probe.py . after

      - name: "Startup stall matrix"
        shell: bash
        run: |
          for p in 999 14,13,15 0,0,0; do
            echo "profile=$p"
            echo -n '  base 062e6430: '; python3 .github/repro/pr11225_stall.py /tmp/pr11225_base $p
            echo -n '  as submitted 3970c93c: '; python3 .github/repro/pr11225_stall.py /tmp/pr11225_v1 $p
            echo -n '  HEAD: '; python3 .github/repro/pr11225_stall.py . $p
          done

      - name: "Worst-case sweep over 110592 wait/stop profiles at HEAD"
        shell: bash
        run: |
          python3 .github/repro/pr11225_sweep.py .

      - name: "Tunnel unit tests at HEAD"
        shell: bash
        run: |
          # huggingface_hub because an autouse session fixture in studio/backend/tests/conftest.py
          # imports it unguarded, so without it every test in the file errors at setup.
          python3 -m pip install --quiet pytest huggingface_hub
          # The sibling suites additionally need structlog/fastapi; they run in the upstream studio job.
          cd studio/backend && python3 -m pytest tests/test_cloudflare_tunnel.py -q

