# Disposable repro workflow. Delete after validation.

name: "PR 10752 merged upload reproduction"

on:
  push:
    branches:
      - "pr-10752-20260910-2122-*"
    paths:
      - "unsloth/save.py"
      - "tests/test_merged_hub_destination.py"
      - ".github/workflows/pr10752-repro.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "${{ matrix.os }} / Hub ${{ matrix.hub }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        hub: ["0.36.2", "1.31.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install pinned test dependencies"
        shell: bash
        run: |
          python -m pip install pytest==9.1.1 huggingface_hub==${{ matrix.hub }}

      - name: "Record versions and refs"
        shell: bash
        run: |
          git rev-parse HEAD
          python -m pip show huggingface_hub pytest

      - name: "Merged upload destination regressions"
        shell: bash
        run: |
          python -m pytest tests/test_merged_hub_destination.py -v --junitxml=destination-results.xml

      - name: Upload assertion results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: destination-${{ matrix.os }}-hub-${{ matrix.hub }}
          path: destination-results.xml
          retention-days: 14
