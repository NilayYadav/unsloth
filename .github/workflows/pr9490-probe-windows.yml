# Disposable repro workflow. Delete after validation.

name: "PR 9490 search-images probe (windows-latest)"

on:
  push:
    branches:
      - "pr9490-evidence-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "windows-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install the probe dependencies"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pillow structlog

      - name: "PR 9490 search-images probe"
        shell: bash
        run: |
          python .github/pr9490/probe_pr9490_search_images.py

