# Disposable repro workflow. Delete after validation.

name: "PR 10551 terminal output"

on:
  push:
    branches:
      - "pr10551-term-20260909-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install probe dependencies"
        shell: bash
        run: |
          python -m pip install -q --upgrade pip && python -m pip install -q 'typer==0.27.1' 'click<8.3' pytest pyyaml requests httpx pydantic structlog nest-asyncio huggingface-hub rich

      - name: "Real `unsloth start` terminal output for a 17-minute download behind an unmarked child"
        shell: bash
        run: |
          PYTHONPATH=$GITHUB_WORKSPACE python -m pytest probe_pr10551.py -s -q --noconftest -p no:randomly -k test_a_download_behind_an_unmarked_child_is_tracked_to_ready || echo 'EXIT: the readiness loop gave up'

