name: PR 14029 page proxy vs system proxy

on:
  pull_request:
    branches: ['pr14029-ab-base']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: page proxy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    env:
      PROBE_PROXY_PORT: '18888'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            gsettings-desktop-schemas glib-networking dconf-gsettings-backend dconf-service dbus-x11
      - name: Placeholder frontend dist and PAC file
        shell: bash
        run: |
          mkdir -p studio/frontend/dist "$RUNNER_TEMP/pac"
          echo '<!doctype html><title>probe</title>' > studio/frontend/dist/index.html
          cat > "$RUNNER_TEMP/pac/proxy.pac" <<'PAC'
          function FindProxyForURL(url, host) {
            if (dnsDomainIs(host, "example.com")) return "PROXY 127.0.0.1:18888";
            return "DIRECT";
          }
          PAC
      - name: Build tests
        working-directory: studio/src-tauri
        run: cargo test --bin unsloth-studio --no-run
      - name: Probe (no proxy configured)
        working-directory: studio/src-tauri
        shell: bash
        env:
          PROBE_MODE: none
        run: cargo test --bin unsloth-studio proxy_ab_probe -- --nocapture --test-threads 1

      - name: macOS - System Settings HTTP/HTTPS proxy
        if: runner.os == 'macOS'
        working-directory: studio/src-tauri
        shell: bash
        env:
          PROBE_MODE: proxied
        run: |
          networksetup -listallnetworkservices | tail -n +2 | sed 's/^\*//' | while IFS= read -r svc; do
            sudo networksetup -setwebproxy "$svc" 127.0.0.1 18888 off
            sudo networksetup -setsecurewebproxy "$svc" 127.0.0.1 18888 off
          done
          sleep 3; scutil --proxy
          cargo test --bin unsloth-studio proxy_ab_probe -- --nocapture --test-threads 1
      - name: macOS - System Settings PAC
        if: runner.os == 'macOS'
        working-directory: studio/src-tauri
        shell: bash
        env:
          PROBE_MODE: pac
        run: |
          (cd "$RUNNER_TEMP/pac" && python3 -m http.server 18889 --bind 127.0.0.1 > "$RUNNER_TEMP/pac.log" 2>&1 &)
          networksetup -listallnetworkservices | tail -n +2 | sed 's/^\*//' | while IFS= read -r svc; do
            sudo networksetup -setwebproxystate "$svc" off
            sudo networksetup -setsecurewebproxystate "$svc" off
            sudo networksetup -setautoproxyurl "$svc" http://127.0.0.1:18889/proxy.pac
          done
          sleep 3; scutil --proxy
          cargo test --bin unsloth-studio proxy_ab_probe -- --nocapture --test-threads 1
          cat "$RUNNER_TEMP/pac.log"

      - name: Windows - Internet Options fixed proxy
        if: runner.os == 'Windows'
        working-directory: studio/src-tauri
        shell: pwsh
        env:
          PROBE_MODE: proxied
        run: |
          $k = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
          Get-ItemProperty $k | Select-Object ProxyEnable,ProxyServer,AutoConfigURL,AutoDetect | Format-List
          Set-ItemProperty $k ProxyEnable 1 -Type DWord
          Set-ItemProperty $k ProxyServer '127.0.0.1:18888'
          cargo test --bin unsloth-studio proxy_ab_probe -- --nocapture --test-threads 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows - Internet Options setup script (PAC)
        if: runner.os == 'Windows'
        working-directory: studio/src-tauri
        shell: pwsh
        env:
          PROBE_MODE: pac
        run: |
          $k = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
          Set-ItemProperty $k ProxyEnable 0 -Type DWord
          Remove-ItemProperty $k ProxyServer -ErrorAction SilentlyContinue
          Start-Process python -ArgumentList '-m','http.server','18889','--bind','127.0.0.1','--directory',"$env:RUNNER_TEMP\pac" -WindowStyle Hidden
          Start-Sleep 2
          Set-ItemProperty $k AutoConfigURL 'http://127.0.0.1:18889/proxy.pac'
          cargo test --bin unsloth-studio proxy_ab_probe -- --nocapture --test-threads 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Linux - GNOME manual proxy
        if: runner.os == 'Linux'
        working-directory: studio/src-tauri
        shell: bash
        env:
          PROBE_MODE: proxied
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          dbus-run-session -- bash -c '
            gsettings set org.gnome.system.proxy mode manual
            gsettings set org.gnome.system.proxy.http host 127.0.0.1
            gsettings set org.gnome.system.proxy.http port 18888
            gsettings set org.gnome.system.proxy.https host 127.0.0.1
            gsettings set org.gnome.system.proxy.https port 18888
            gsettings list-recursively org.gnome.system.proxy | grep -E "mode|host|port"
            cargo test --bin unsloth-studio proxy_ab_probe -- --nocapture --test-threads 1'
      - name: Linux - GNOME automatic proxy (PAC)
        if: runner.os == 'Linux'
        working-directory: studio/src-tauri
        shell: bash
        env:
          PROBE_MODE: pac
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          (cd "$RUNNER_TEMP/pac" && python3 -m http.server 18889 --bind 127.0.0.1 > "$RUNNER_TEMP/pac.log" 2>&1 &)
          sleep 1
          dbus-run-session -- bash -c '
            gsettings set org.gnome.system.proxy mode auto
            gsettings set org.gnome.system.proxy autoconfig-url http://127.0.0.1:18889/proxy.pac
            cargo test --bin unsloth-studio proxy_ab_probe -- --nocapture --test-threads 1' || echo "::warning::GNOME PAC leg failed"
          cat "$RUNNER_TEMP/pac.log"
      - name: Linux - HTTPS_PROXY / HTTP_PROXY variables
        if: runner.os == 'Linux'
        working-directory: studio/src-tauri
        shell: bash
        env:
          PROBE_MODE: proxied
          HTTP_PROXY: http://127.0.0.1:18888
          HTTPS_PROXY: http://127.0.0.1:18888
        run: cargo test --bin unsloth-studio proxy_ab_probe -- --nocapture --test-threads 1
