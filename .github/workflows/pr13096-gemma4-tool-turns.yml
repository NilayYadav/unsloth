# Disposable repro workflow. Delete after validation.

name: "PR 13096 Gemma 4 tool turns"

on:
  push:
    branches:
      - "pr13096-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install backend + unsloth (CPU)"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 mammoth unpdf requests typer 'numpy<3' pytest pytest-timeout httpx
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11' 'torchvision<0.26' 'torchaudio<2.11'
          pip install 'transformers>=4.51,<=5.17.0' 'bitsandbytes>=0.45'
          pip install "$(grep -m1 -E '^peft==' studio/backend/requirements/extras-no-deps.txt)"
          pip install "unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo"
          pip install -e . --no-deps

      - name: "Gemma 4 tool result reaches the prompt (must not skip)"
        shell: bash
        run: |
          cd studio/backend
          export UNSLOTH_COMPILE_DISABLE=1
          set +e
          python -m pytest tests/test_gemma4_safetensors_tool_turns.py -q -rs --tb=short -p no:cacheprovider 2>&1 | tee /tmp/out.txt
          rc=${PIPESTATUS[0]}
          set -e
          if grep -qiE '[0-9]+ skipped' /tmp/out.txt; then echo 'FAIL: test skipped, harness did not reach the real backend'; exit 2; fi
          echo "pytest rc=$rc"
          exit $rc

