# Disposable repro workflow. Delete after validation.

name: "PR 12310 image tests windows-latest"

on:
  push:
    branches:
      - "pr12310-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "windows-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install Studio backend test deps"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 mammoth unpdf requests 'numpy<3' pytest pytest-asyncio pytest-timeout httpx soundfile librosa
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11'
          pip install 'transformers>=4.51,<5.5'
          grep -m1 -E '^peft==' studio/backend/requirements/extras-no-deps.txt | xargs pip install
          python -c "import PIL, sys; print('PIL', PIL.__version__, sys.platform)"

      - name: "Transparent image tests"
        shell: bash
        run: |
          python -m pytest studio/backend/tests/test_llama_image_passthrough.py -v -p no:cacheprovider

