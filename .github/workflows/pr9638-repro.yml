# Disposable repro workflow. Delete after validation.

name: "PR 9638 vision image repro"

on:
  push:
    branches:
      - "mimir-pr9638-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: "Install backend test dependencies (CPU only)"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install \
            python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests \
            'numpy<3' pytest pytest-asyncio pytest-xdist pytest-timeout httpx \
            soundfile librosa
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11'
          pip install 'transformers>=4.51,<5.5'
          pip install "$(grep -m1 -E '^peft==' studio/backend/requirements/extras-no-deps.txt)"

      - name: "Probe: which image reaches the model"
        shell: bash
        run: |
          cd studio/backend
          python ../../.github/scripts/pr9638_probe.py

      - name: "PR 9638 regression tests"
        shell: bash
        run: |
          cd studio/backend
          python -m pytest tests/test_openai_tool_passthrough.py \
            -k "latest_image_wins_over_earlier_turns or single_image_still_returned or payloadless_later_image_keeps_earlier_one" \
            -v --timeout=180 -p no:cacheprovider

