# Disposable repro workflow. Delete after validation.

name: "PR 12239 MLX Hub push A/B (macOS)"

on:
  push:
    branches:
      - "pr12239-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "macos-26"
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install Studio backend deps, MLX and unsloth_zoo (as mlx-ci.yml)"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install 'python-multipart==0.0.27' 'aiofiles==25.1.0' 'sqlalchemy==2.0.49' 'cryptography==48.0.0' 'pyyaml==6.0.3' 'jinja2==3.1.6' 'mammoth==1.12.0' 'unpdf==1.0.0' 'requests==2.33.1' 'typer==0.25.1' 'numpy==2.4.4' 'pytest==9.0.3' 'pytest-asyncio==1.3.0' 'httpx==0.28.1'
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch==2.10.0'
          for attempt in 1 2 3; do pip install 'unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo' && break; sleep $((5*attempt)); done
          pip install -e . --no-deps
          python -c "import unsloth, huggingface_hub, unsloth_zoo; print('IS_MLX', unsloth._IS_MLX, 'hf_hub', huggingface_hub.__version__)"
          git log -1 --format='tree under test: %H %s'

      - name: "PR 12239 A/B: export tests and real MLX export + Hub push probe on Apple Silicon"
        shell: bash
        run: |
          set +e
          export UNSLOTH_COMPILE_DISABLE=1
          python -m pytest -q -p no:cacheprovider studio/backend/tests/test_export_hub_push.py -k mlx 2>&1 | tail -25
          T=${PIPESTATUS[0]}
          cd studio/backend
          PROBE_WORK="$RUNNER_TEMP/probe" python ../../.github/pr12239/mlx_hub_push_probe.py 2>&1 | grep -v 'Fetching\|it/s]'
          P=${PIPESTATUS[0]}
          echo "RESULT pytest_rc=$T probe_rc=$P"
          [ "$T" = 0 ] && [ "$P" = 0 ]

