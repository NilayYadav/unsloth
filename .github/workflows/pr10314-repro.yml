# Disposable repro workflow for unslothai/unsloth#10314. Delete after validation.
#
# Loads unsloth/gemma-3-270m-it-GGUF -- a real GGUF whose chat template does NOT
# advertise tool support -- and drives /v1/messages and /v1/chat/completions
# against it. Identical bytes on the before/after branches; only the
# implementation under test differs.

name: "PR 10314 tools-on-a-toolless-template repro"

on:
  push:
    branches:
      - 'pr10314-tools400-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "PR 10314 repro (${{ github.ref_name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      GGUF_REPO: unsloth/gemma-3-270m-it-GGUF
      GGUF_FILE: gemma-3-270m-it-UD-Q4_K_XL.gguf
      STUDIO_PORT: '18888'
      STUDIO_LOG: logs/studio.log
      HF_XET_CACHE: ${{ github.workspace }}/xet-scratch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Linux deps for llama.cpp prebuilt
        timeout-minutes: 15
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq || { apt-get update && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq; }'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Unsloth (--local, --no-torch)
        id: install
        timeout-minutes: 25
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore GGUF model file
        id: cache-gguf
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: gguf-cache
          key: gguf-pr10314-${{ env.GGUF_FILE }}-v1
          enableCrossOsArchive: true

      - name: Download GGUF if cache miss
        id: download-gguf
        timeout-minutes: 15
        if: ${{ steps.cache-gguf.outputs.cache-hit != 'true' || steps.cache-gguf.outcome != 'success' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p gguf-cache
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE" gguf-cache

      - name: Reset auth + boot Unsloth (API-only)
        id: boot
        timeout-minutes: 5
        run: |
          bash .github/scripts/boot-studio-api-only.sh --port "$STUDIO_PORT" --log "$STUDIO_LOG"

      - name: Wait for health, log in, load the toolless GGUF
        id: ready
        timeout-minutes: 15
        run: |
          for i in $(seq 1 180); do
            if curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" > /tmp/health.json; then
              jq -e '.status == "healthy"' /tmp/health.json && break
            fi
            sleep 1
          done
          jq -e '.status == "healthy"' /tmp/health.json
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIRepro-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          echo "::add-mask::$TOKEN"
          echo "API_KEY=$TOKEN" >> "$GITHUB_ENV"
          GGUF_PATH="$GITHUB_WORKSPACE/gguf-cache/${GGUF_FILE}"
          ls -lh "$GGUF_PATH"
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            --max-time 900 \
            -d "{\"model_path\":\"$GGUF_PATH\",\"is_lora\":false,\"max_seq_length\":2048}" \
            | jq '{status, display_name}'

      - name: Run the PR 10314 probe
        id: probe
        timeout-minutes: 20
        env:
          PROBE_OUT: ${{ github.workspace }}/probe-result.json
        run: |
          python .github/scripts/pr10314_probe.py

      - name: Show Studio log tail
        if: always()
        run: tail -n 200 "$STUDIO_LOG" || true

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr10314-probe-${{ github.ref_name }}
          path: |
            probe-result.json
            logs/
          if-no-files-found: warn
