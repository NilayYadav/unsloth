# Disposable repro workflow. Delete after validation.

name: "PR 9893 cancel-during-load repro"

on:
  push:
    branches:
      - "pr9893-repro-neg-20260827215243"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Which implementation is under test"
        shell: bash
        run: |
          git log --oneline -3
          echo '--- _wait_for_health cancel check present? ---'
          if grep -q 'cancel_event.is_set()' studio/backend/core/inference/llama_cpp.py && sed -n '/def _wait_for_health/,/health_probe_event.clear()/p' studio/backend/core/inference/llama_cpp.py | grep -q cancel_event; then echo 'SIDE=POSITIVE (fix present)'; else echo 'SIDE=NEGATIVE (fix absent)'; fi

      - name: "Install probe dependencies"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'httpx>=0.27' pytest huggingface_hub

      - name: "Cancel latency probe + PR regression tests"
        shell: bash
        run: |
          set +e
          rc_total=0
          
          echo '==================== PR regression tests ===================='
          cd studio/backend
          python -m pytest tests/test_llama_cpp_wait_for_health.py -v --tb=short -p no:randomly
          rc_tests=$?
          cd ../..
          echo "TESTS_RC=$rc_tests"
          
          echo '==================== End-to-end cancel latency ===================='
          export PROBE_HEALTH_TIMEOUT=180
          export PROBE_CLICK_AFTER=2
          export PROBE_PASS_UNDER=10
          python pr9893_cancel_latency_probe.py
          rc_probe=$?
          echo "PROBE_RC=$rc_probe"
          
          echo '==================== Verdict ===================='
          if [ $rc_tests -ne 0 ] || [ $rc_probe -ne 0 ]; then rc_total=1; fi
          echo "TESTS_RC=$rc_tests PROBE_RC=$rc_probe OVERALL_RC=$rc_total"
          exit $rc_total

