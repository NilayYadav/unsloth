# Disposable repro workflow. Delete after validation.

name: "PR 13648 read aloud repro"

on:
  push:
    branches:
      - "pr13648-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: "Install frontend deps"
        shell: bash
        run: |
          cd studio/frontend
          npm ci --ignore-scripts --no-audit --no-fund

      - name: "Read aloud tests"
        shell: bash
        run: |
          cd studio/frontend
          node --experimental-strip-types --test tests/read-aloud-studio-voice.test.ts tests/tts-custom-connections-disabled.test.ts

