# Disposable repro workflow. Delete after validation.

name: "PR 12234 pool fork test (windows-latest)"

on:
  push:
    branches:
      - "pr12234-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "windows-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install test deps"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-timeout structlog huggingface_hub httpx fastapi

      - name: "Pool tests incl. fork-while-in-sqlite"
        shell: bash
        run: |
          cd studio/backend
          python -m pytest tests/test_chat_generation_runs_pool.py -v --timeout=180 -p no:cacheprovider -rA

