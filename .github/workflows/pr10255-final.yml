# Disposable evidence workflow for unslothai/unsloth#10255. Delete after validation.
# Three probes, one dependency set, one runner image. Only the unsloth tree differs.

name: "PR 10255 final - input_audio part, guards and refusals"

on:
  push:
    branches:
      - "pr10255-final-20260904005743"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: "${{ matrix.leg }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: "A  upstream main 8e26d2c2b (no fix)"
            ref: "8e26d2c2bacfddff53bf3e353213bc898f8c86e4"
            merge_head: ""
            mode_audio: "expect-broken"
            mode_count: "expect-rejected"
          - leg: "B  first commit 8690d62f4 (before review)"
            ref: "8690d62f43d43ebb3b79994f8b3718dda5d35ac3"
            merge_head: ""
            mode_audio: "expect-fixed"
            mode_count: "expect-bypassed"
          - leg: "C  converged head 54dcda709"
            ref: "54dcda70906a4019bf61544716d0930d976356d8"
            merge_head: ""
            mode_audio: "expect-fixed"
            mode_count: "expect-guarded"
          - leg: "D  main + converged head merged"
            ref: "8e26d2c2bacfddff53bf3e353213bc898f8c86e4"
            merge_head: "54dcda70906a4019bf61544716d0930d976356d8"
            mode_audio: "expect-fixed"
            mode_count: "expect-guarded"
    steps:
      - name: "Checkout the probes (this branch)"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          path: harness

      - name: "Checkout the unsloth tree under test"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: unslothai/unsloth
          ref: "${{ matrix.ref }}"
          fetch-depth: 0
          persist-credentials: false
          path: tree

      - name: "Merge the PR head onto it"
        if: matrix.merge_head != ''
        working-directory: tree
        run: |
          set -euo pipefail
          git config user.email ci@example.com
          git config user.name ci
          git fetch --no-tags origin refs/pull/10255/head
          got="$(git rev-parse FETCH_HEAD)"
          echo "PR 10255 head fetched: $got"
          test "$got" = "${{ matrix.merge_head }}"
          git merge --no-edit FETCH_HEAD
          echo "merged tree HEAD: $(git rev-parse HEAD)"

      - name: "Record the tree under test"
        working-directory: tree
        run: |
          set -euo pipefail
          echo "HEAD = $(git rev-parse HEAD)"
          echo "-- accepted content-part tags:"
          grep -n "Annotated\[.*ContentPart, Tag(" studio/backend/models/inference.py || true
          echo "-- refusal call sites:"
          grep -rn "_reject_unsupported_content_parts(" studio/backend/routes/*.py | grep -v "^.*def " || echo "  none"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install the probe dependency set (identical on every leg)"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            fastapi pydantic structlog pyyaml pyjwt huggingface_hub \
            httpx python-multipart cryptography

      - name: "Probe 1: /v1/chat/completions takes the part (${{ matrix.mode_audio }})"
        working-directory: tree/studio/backend
        env: {PYTHONPATH: ".", UNSLOTH_ALLOW_CPU: "1", UNSLOTH_IS_PRESENT: "1"}
        run: python "$GITHUB_WORKSPACE/harness/repro/probe_input_audio.py" "${{ matrix.mode_audio }}"

      - name: "Probe 2: /chat/count_tokens still refuses audio (${{ matrix.mode_count }})"
        if: always()
        working-directory: tree/studio/backend
        env: {PYTHONPATH: ".", UNSLOTH_ALLOW_CPU: "1", UNSLOTH_IS_PRESENT: "1"}
        run: python "$GITHUB_WORKSPACE/harness/repro/probe_count_route.py" "${{ matrix.mode_count }}"

      - name: "Probe 3: every shape, with its real status"
        if: always()
        working-directory: tree/studio/backend
        env: {PYTHONPATH: ".", UNSLOTH_ALLOW_CPU: "1", UNSLOTH_IS_PRESENT: "1"}
        run: |
          python "$GITHUB_WORKSPACE/harness/repro/probe_refusals.py" \
            "${{ matrix.mode_count == 'expect-guarded' && 'expect-final' || 'report' }}"

      - name: "The PR's own regression tests"
        if: always()
        working-directory: tree/studio/backend
        env: {PYTHONPATH: ".", UNSLOTH_ALLOW_CPU: "1", UNSLOTH_IS_PRESENT: "1"}
        run: |
          python -m pip install -q pytest
          if [ -f tests/test_chat_input_audio_part.py ]; then
            python -m pytest tests/test_chat_input_audio_part.py -q -p no:randomly
          else
            echo "absent on this tree"
          fi
