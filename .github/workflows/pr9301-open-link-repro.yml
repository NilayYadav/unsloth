# Disposable repro workflow. Delete after validation.

name: "PR 9301 open-link activation repro"

on:
  push:
    branches:
      - "pr9301-open-link-activation-20260823150303"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install Playwright browsers"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium firefox webkit

      - name: "ui/open-link keeps user activation (chromium, firefox, webkit, firefox+blocker)"
        shell: bash
        run: |
          python tests/studio/mcp_app_open_link_activation.py

