name: PR 11227 duplicate-weight repro

on:
  push:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Backend deps
        run: python3 -m pip install -q structlog pytest

      - name: Backend download size for real Hub repos
        id: backend
        run: |
          cd studio/backend
          python3 - <<'PY'
          import json, sys, types, urllib.request
          sys.path.insert(0, ".")
          from hub.utils.snapshot_filters import snapshot_download_size

          REPOS = ["openai/gpt-oss-20b", "meta-llama/Llama-3.2-1B-Instruct",
                   "openai/whisper-small", "bigscience/bloom"]
          # bloom shards its root safetensors with an underscore and ships the same
          # 72 shards again as .bin, so it only drops below 400 GB once the trigger
          # accepts that separator.
          LIMIT_GB = {"openai/gpt-oss-20b": 20.0, "bigscience/bloom": 400.0}
          out = {}
          failed = []
          for repo in REPOS:
              url = f"https://huggingface.co/api/models/{repo}?blobs=true"
              with urllib.request.urlopen(url, timeout=60) as fh:
                  data = json.load(fh)
              sib = [types.SimpleNamespace(rfilename=s["rfilename"], size=s.get("size"))
                     for s in data.get("siblings", [])]
              every = sum(s.size for s in sib if isinstance(s.size, int) and s.size > 0)
              picked = snapshot_download_size(sib)
              out[repo] = picked
              print(f"{repo}: repo ships {every/1e9:.2f} GB, Studio downloads {picked/1e9:.2f} GB")
              limit = LIMIT_GB.get(repo)
              if limit is not None and picked / 1e9 >= limit:
                  failed.append(f"FAIL {repo}: downloads {picked/1e9:.2f} GB, expected < {limit} GB")

          json.dump(out, open("/tmp/backend_sizes.json", "w"))
          for line in failed:
              print(line)
          if failed:
              sys.exit(1)
          print("PASS backend: no duplicate weight formats downloaded")
          PY

      - name: Frontend displayed size matches the backend download
        run: |
          cd studio/frontend
          npm ci --no-audit --no-fund
          cat > /tmp/parity.test.ts <<'TS'
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          import test from "node:test";
          import { registerBundlerResolver } from "./helpers/kit.ts";

          registerBundlerResolver();
          const { fetchModelSize } = await import("../src/features/hub/lib/dataset-size.ts");

          const backend = JSON.parse(readFileSync("/tmp/backend_sizes.json", "utf8")) as Record<string, number>;

          // Captured before the first stub: the loop replaces globalThis.fetch, so
          // without this the second repo re-fetches the first repo's file list.
          const realFetch = globalThis.fetch;

          test("displayed size equals downloaded size", async () => {
            for (const [repo, expected] of Object.entries(backend)) {
              const res = await realFetch(`https://huggingface.co/api/models/${repo}?blobs=true`);
              const siblings = ((await res.json()) as { siblings: unknown[] }).siblings;
              globalThis.fetch = (async () =>
                new Response(JSON.stringify({ siblings }), {
                  status: 200,
                  headers: { "content-type": "application/json" },
                })) as typeof fetch;
              const shown = await fetchModelSize(repo);
              console.log(`${repo}: shown ${(shown!.totalBytes / 1e9).toFixed(2)} GB, downloaded ${(expected / 1e9).toFixed(2)} GB`);
              assert.equal(shown!.totalBytes, expected, `${repo} displayed size must equal the download`);
            }
          });
          TS
          cp /tmp/parity.test.ts tests/zz-parity.test.ts
          node --experimental-strip-types --test tests/zz-parity.test.ts

      - name: PR-owned test suites
        run: |
          cd studio/backend
          python3 -m pytest tests/test_hub_snapshot_duplicate_weight_formats.py \
            tests/test_embedding_model_resolve.py tests/test_appledouble_guards.py -q
