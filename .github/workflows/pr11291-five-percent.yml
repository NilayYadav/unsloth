name: PR 11291 Windows 5 percent progress
on:
  push:
    branches: [pr11291-five-percent-check]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      UNSLOTH_NO_TORCH: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: python -m pip install pytest playwright pillow
      - name: Windows PowerShell 5.1 and PowerShell 7 checks
        run: >-
          python -m pytest
          tests/python/test_windows_setup_download_progress.py
          tests/python/test_windows_setup_output_encoding.py
          tests/studio/install/test_install_node_prebuilt_logic.py
          tests/studio/install/test_setup_whisper_status.py
          -q -rs --junitxml=evidence/tests.xml
      - run: npm ci --no-audit --no-fund
        working-directory: studio/frontend
      - run: python -m playwright install chromium
      - name: Live Windows downloads in the update screen
        run: python evidence/windows_browser.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-download-progress
          path: evidence
          retention-days: 7
