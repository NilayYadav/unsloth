# PR 10096 A/B reproduction. The same workflow and the same probe file run on two
# branches that differ only in studio/backend/routes/inference.py:
#
#   pr10096-repro-before : merge base 2da377132 -> the probe must FAIL
#   pr10096-repro-after  : PR head + fix       -> the probe must PASS
#
# The probe drives the real /v1/messages route with a stub llama backend and a
# client that disconnects once tokens are already flowing, then reads the
# api-monitor row the run produced.

name: PR 10096 disconnect repro

on:
  push:
    branches:
      - pr10096-repro-before
      - pr10096-repro-after
  workflow_dispatch:

concurrency:
  group: pr10096-repro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: non-streaming disconnect probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install backend test dependencies (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install \
            python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests \
            'numpy<3' pytest pytest-asyncio pytest-timeout httpx
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            'torch>=2.4,<2.11' 'torchaudio<2.11'
          pip install 'transformers>=4.51,<5.5'
          pip install "$(grep -m1 -E '^peft==' studio/backend/requirements/extras-no-deps.txt)"

      - name: Which side is this
        run: |
          echo "branch=${GITHUB_REF_NAME}"
          echo "sha=${GITHUB_SHA}"
          git log -1 --format='%H %s'

      - name: Reproduction probe
        working-directory: studio/backend
        run: |
          python -m pytest tests/test_pr10096_disconnect_probe.py \
            -p no:randomly -q -s --timeout=300
