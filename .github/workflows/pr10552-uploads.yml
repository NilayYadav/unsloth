name: "PR 10552 Uploads A/B"

on:
  push:
    branches:
      - "mimir-pr10552-up-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: "Uploads A/B (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Which upload routes are async here
        shell: bash
        run: grep -n -B1 'def upload_kb_document' studio/backend/routes/rag.py
      - name: Run isolated simulations
        run: python tests/studio/rag_upload_ci.py
