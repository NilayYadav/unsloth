# Disposable repro workflow. Delete after validation.

name: "PR 12793 Library overlay (Windows, macOS)"

on:
  push:
    branches:
      - "pr12793-xplat-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install backend test deps (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 mammoth unpdf requests 'numpy<3' pytest pytest-asyncio pytest-timeout httpx
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11'
          pip install 'transformers>=4.51,<=5.17.0'
      - name: Library overlay tests (adjacent)
        working-directory: studio/backend
        run: python -m pytest tests/test_library_routes.py -q -rs --timeout=300 -k "sandbox or overlay or favorite" --deselect tests/test_library_routes.py::test_a_sandbox_file_the_model_edits_keeps_its_name_star_and_folder
      - name: Edited sandbox file keeps its overlay
        if: always()
        working-directory: studio/backend
        run: python -m pytest tests/test_library_routes.py -q -rA --timeout=300 -k test_a_sandbox_file_the_model_edits_keeps_its_name_star_and_folder
