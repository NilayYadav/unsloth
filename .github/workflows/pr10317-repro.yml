# Disposable repro workflow. Delete after validation.

name: "PR 10317 GGUF Hub double-convert repro"

on:
  push:
    branches:
      - "pr10317-repro-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Identify the implementation under test"
        shell: bash
        run: |
          set -eux
          git rev-parse HEAD
          git log --oneline -3
          echo '--- export_gguf Hub leg on this branch ---'
          sed -n '/logger.info(f"Pushing GGUF model to Hub/,/GGUF model pushed successfully/p' studio/backend/core/export/export.py

      - name: "Install probe dependency"
        shell: bash
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install pytest

      - name: "Free disk report before export"
        shell: bash
        run: |
          df -h / | tail -1

      - name: "PR 10317 repro probe: count GGUF conversions on a Hub export"
        shell: bash
        run: |
          python ci/pr10317_probe.py

