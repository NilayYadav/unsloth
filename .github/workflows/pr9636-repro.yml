# Disposable repro workflow. Delete after validation.

name: "PR 9636 MCP embedded-resource image repro"

on:
  push:
    branches:
      - "mimir-pr9636-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install the real MCP SDKs"
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'mcp==1.29.0' 'fastmcp==3.4.5' pytest structlog
          python -c "import mcp, fastmcp, importlib.metadata as m; print('mcp', m.version('mcp')); print('fastmcp', m.version('fastmcp'))"

      - name: "Reproduce: do MCP EmbeddedResource images render?"
        shell: bash
        run: |
          python pr9636_repro_probe.py

      - name: "PR regression tests"
        shell: bash
        run: |
          cd studio/backend && python -m pytest tests/test_mcp_flatten_result.py -q --noconftest

