# Disposable repro workflow. Delete after validation.
name: "PR 12994 real Docker repro"

on:
  push:
    branches:
      - "pr12994-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-script-saves:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Free disk for the 8 GB image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h / | tail -1
      - name: Pull unsloth/unsloth:core
        run: |
          docker pull -q unsloth/unsloth:core
          docker image inspect unsloth/unsloth:core --format 'image {{.Id}} workdir={{.Config.WorkingDir}} user={{.Config.User}}'
      - name: Write a CPU training script into a project folder
        run: |
          mkdir -p "$RUNNER_TEMP/proj"
          cat > "$RUNNER_TEMP/proj/train.py" <<'PY'
          import os
          print("cwd:", os.getcwd(), flush=True)
          from datasets import Dataset
          from peft import LoraConfig, get_peft_model
          from transformers import AutoModelForCausalLM, AutoTokenizer, DataCollatorForLanguageModeling, Trainer, TrainingArguments
          name = "hf-internal-testing/tiny-random-LlamaForCausalLM"
          tok = AutoTokenizer.from_pretrained(name)
          tok.pad_token = tok.pad_token or tok.eos_token
          model = get_peft_model(AutoModelForCausalLM.from_pretrained(name), LoraConfig(r=8, target_modules=["q_proj", "v_proj"], task_type="CAUSAL_LM"))
          ds = Dataset.from_dict({"text": ["hello world, this is unsloth"] * 16}).map(lambda b: tok(b["text"]), batched=True, remove_columns=["text"])
          args = TrainingArguments(output_dir="outputs", max_steps=4, save_steps=4, per_device_train_batch_size=4, report_to=[], use_cpu=True, logging_steps=1)
          Trainer(model=model, args=args, train_dataset=ds, data_collator=DataCollatorForLanguageModeling(tok, mlm=False)).train()
          model.save_pretrained("lora_model")
          tok.save_pretrained("lora_model")
          print("saved LoRA to", os.path.abspath("lora_model"), "and checkpoints to", os.path.abspath("outputs"), flush=True)
          PY
          id
      - name: "Flow 1: bash docker/run.sh python /workspace/host/train.py"
        run: |
          cd "$RUNNER_TEMP/proj"
          UNSLOTH_IMAGE=unsloth/unsloth:core UNSLOTH_GPUS=none UNSLOTH_ALLOW_CPU=1 UNSLOTH_STUDIO_VOLUME= \
            UNSLOTH_SKIP_NOTEBOOK_SYNC=1 bash "$GITHUB_WORKSPACE/docker/run.sh" python /workspace/host/train.py 2>&1 \
            | grep -E "^cwd:|saved LoRA|'loss'|train_runtime|Error|Traceback" || true
          echo "--- project dir after the run:"
          find . -maxdepth 2 | sort
          ls -lan
      - name: "Flow 2: the Docker Hub Scripts command, verbatim from DOCKERHUB.md (GPU flag swapped for CPU)"
        run: |
          mkdir -p "$RUNNER_TEMP/proj2" && cp "$RUNNER_TEMP/proj/train.py" "$RUNNER_TEMP/proj2/" && cd "$RUNNER_TEMP/proj2"
          CMD=$(python3 - "$GITHUB_WORKSPACE/docker/DOCKERHUB.md" <<'PY'
          import sys
          t = open(sys.argv[1]).read(); s = t[t.index("### Scripts"):]; a = s.index("```bash") + 7
          print(s[a:s.index("```", a)].replace("\\\n", " ").strip())
          PY
          )
          echo "doc command: $CMD"
          CMD="${CMD/--gpus all/-e UNSLOTH_ALLOW_CPU=1 -e UNSLOTH_SKIP_NOTEBOOK_SYNC=1}"
          eval "$CMD" 2>&1 | grep -E "^cwd:|saved LoRA|train_runtime|Error|Traceback" || true
          echo "--- project dir after the run:"
          find . -maxdepth 2 | sort
      - name: "Adjacent: commands that must still start in /workspace, and the host-script case"
        run: |
          cd "$RUNNER_TEMP/proj"
          echo 'import os; print(os.getcwd())' > pwd.py
          export UNSLOTH_IMAGE=unsloth/unsloth:core UNSLOTH_GPUS=none UNSLOTH_ALLOW_CPU=1 UNSLOTH_STUDIO_VOLUME= UNSLOTH_SKIP_NOTEBOOK_SYNC=1
          printf '%-40s %s\n' "pwd" "$(bash "$GITHUB_WORKSPACE/docker/run.sh" pwd 2>/dev/null | tail -1)"
          printf '%-40s %s\n' "bash -c pwd" "$(bash "$GITHUB_WORKSPACE/docker/run.sh" bash -c pwd 2>/dev/null | tail -1)"
          printf '%-40s %s\n' "python -c getcwd" "$(bash "$GITHUB_WORKSPACE/docker/run.sh" python -c 'import os; print(os.getcwd())' 2>/dev/null | tail -1)"
          printf '%-40s %s\n' "python /workspace/host/pwd.py" "$(bash "$GITHUB_WORKSPACE/docker/run.sh" python /workspace/host/pwd.py 2>/dev/null | tail -1)"
      - name: "Ownership of what the run left in the project folder"
        run: |
          cd "$RUNNER_TEMP/proj"
          stat -c '%U:%G %n' . train.py lora_model outputs unsloth_compiled_cache 2>/dev/null || true
          if rm -rf lora_model 2>/tmp/rm.err; then echo "runner user can delete lora_model: yes"; else echo "runner user can delete lora_model: NO ($(head -1 /tmp/rm.err))"; fi
      - name: "ASSERT: the saved adapter and checkpoint are in the project folder"
        run: |
          test -f "$RUNNER_TEMP/proj2/lora_model/adapter_model.safetensors" || { echo "FAIL: docs command: lora_model not in the project folder"; F=1; }
          test -d "$RUNNER_TEMP/proj/outputs/checkpoint-4" || { echo "FAIL: run.sh: outputs/checkpoint-4 not in the project folder"; F=1; }
          [ -z "${F:-}" ] && echo "PASS: run.sh and the docs command both keep lora_model and outputs/checkpoint-4"
          exit ${F:-0}
