# Disposable repro workflow. Delete after validation.

name: "PR 12575 Gemma 4 tool masking (windows-latest)"

on:
  push:
    branches:
      - "pr12575-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "windows-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install CPU stack and unsloth_zoo"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install pytest pytest-timeout psutil pyyaml jinja2 structlog
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11' 'torchvision<0.26'
          pip install 'transformers==5.5.0' tokenizers
          pip install "unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo"
          pip install 'transformers==5.5.0' 'datasets==4.3.0'
          python -c "import transformers, datasets, torch; print('versions', transformers.__version__, datasets.__version__, torch.__version__)"

      - name: "Gemma 4 tool masking tests"
        shell: bash
        run: |
          cd studio/backend
          python -m pytest tests/test_completion_masking.py -q -rs -p no:cacheprovider -k gemma4 --timeout=600 2>&1 | tee ../../masking.txt
          echo "RESULT: $(tail -1 ../../masking.txt)"

