# Disposable repro workflow. Delete after validation.

name: "PR 10453 download-liveness repro"

on:
  push:
    branches:
      - "pr10453final-*-20260907232305"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Arm identity (branch, commit, probe blob, implementation)"
        shell: bash
        run: |
          set -x
          echo "ref=$GITHUB_REF_NAME"
          echo "sha=$GITHUB_SHA"
          PROBE=tests/studio/test_cli_start_download_liveness.py
          echo "probe_blob=$(git rev-parse HEAD:$PROBE)"
          echo "probe_lines=$(wc -l < $PROBE)"
          if grep -q '_DOWNLOAD_POLL_MAX_BACKOFF_S' unsloth_cli/commands/start.py; then echo 'ARM=head (PR 10453, 8d0c5df)'; else echo 'ARM=main (unmodified)'; fi
          grep -n 'become ready' unsloth_cli/commands/start.py || true

      - name: "Install torch-free probe deps"
        shell: bash
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q 'typer==0.27.1' 'click<8.3' pytest pyyaml requests httpx pydantic structlog nest-asyncio huggingface-hub rich
          python -c "import typer, click, pytest; print('typer', typer.__version__); print('pytest', pytest.__version__)"

      - name: "Run PR 10453 liveness probe"
        shell: bash
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE
          python -m pytest tests/studio/test_cli_start_download_liveness.py --noconftest -p no:cacheprovider -v -rA

      - name: "Mechanism: log bytes the CLI's own /api/health poll makes the server write"
        shell: bash
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/studio/backend
          cd $GITHUB_WORKSPACE/studio/backend
          python - <<'EOF'
          import asyncio, contextlib, io
          import loggers.handlers as H
          
          clock = {"t": 0.0}
          H.time = type("C", (), {"perf_counter": staticmethod(lambda: clock["t"])})()
          
          async def app(scope, receive, send):
              await send({"type": "http.response.start", "status": 200, "headers": []})
              await send({"type": "http.response.body", "body": b'{"status":"healthy"}'})
          
          async def receive():
              return {"type": "http.request", "body": b""}
          
          async def send(_m):
              pass
          
          mw = H.LoggingMiddleware(app)
          buf = io.StringIO()
          with contextlib.redirect_stdout(buf):
              for _ in range(450):  # 450 * 2.0s = one whole 900s start window
                  asyncio.run(mw({"type": "http", "path": "/api/health", "method": "GET",
                                  "query_string": b"", "headers": []}, receive, send))
                  clock["t"] += 2.0
          lines = [l for l in buf.getvalue().splitlines() if l.strip()]
          print("quiet-poll dedup window ms:", H._QUIET_POLL_DEDUP_MS)
          print("CLI health polls in 900s:", 450)
          print("server log lines written:", len(lines))
          print("bytes appended to the start log:", sum(len(l) + 1 for l in lines))
          print("one line every (s):", 900 / max(len(lines), 1))
          print("sample line:", lines[0] if lines else "<none>")
          EOF

