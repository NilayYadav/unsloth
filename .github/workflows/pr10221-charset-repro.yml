# Disposable repro workflow. Delete after validation.

name: "PR 10221 charset repro"

on:
  push:
    branches:
      - "ny-repro-10221-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: "Environment"
        shell: bash
        run: |
          python -V
          echo "commit: $GITHUB_SHA"
          echo "branch: $GITHUB_REF_NAME"
          git --no-pager log --oneline -3

      - name: "Install the only dependency tools.py needs to import"
        shell: bash
        run: |
          python -m pip install --upgrade pip >/dev/null
          pip install structlog
          python -c "import structlog; print('structlog', structlog.__version__)"

      - name: "Show the decode block under test"
        shell: bash
        run: |
          sed -n '/declared = resp.headers.get_content_charset()/,/raw_html = raw_bytes.decode/p' studio/backend/core/inference/tools.py

      - name: "PR 10221 charset probe (gating)"
        shell: bash
        run: |
          python probe_charset.py

