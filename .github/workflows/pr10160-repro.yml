# Disposable repro workflow. Delete after validation.

name: "PR 10160 forget-override A/B"

on:
  push:
    branches:
      - "mimir-pr10160-ab-20260901222810"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: "Install frontend deps"
        shell: bash
        run: |
          cd studio/frontend && npm ci --no-audit --no-fund

      - name: "A/B -- revert one reviewed behaviour at a time, each must fail its own assertions"
        shell: bash
        run: |
          bash .mimir/pr10160_ab.sh

      - name: "Whole frontend suite on head"
        shell: bash
        run: |
          cd studio/frontend && npm test 2>&1 | tail -8

      - name: "Typecheck on head"
        shell: bash
        run: |
          cd studio/frontend && npm run typecheck

      - name: "Head SHA under test"
        shell: bash
        run: |
          git log --oneline -3 && git rev-parse HEAD

