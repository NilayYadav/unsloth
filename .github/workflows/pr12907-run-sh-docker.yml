# Disposable repro workflow. Delete after validation.

name: "PR 12907 run.sh unsloth-run URL in real docker"

on:
  push:
    branches:
      - "pr12907-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: "Free disk for the image"
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h / | tail -1

      - name: "Build this arm's image (docker/ helpers over unsloth/unsloth:latest, as docker/Dockerfile copies them)"
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/Dockerfile.arm" <<'EOF'
          FROM unsloth/unsloth:latest
          COPY unsloth_nb_compat.py unsloth_run.py /opt/unsloth-nb/
          RUN SP=$(/opt/unsloth-venv/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])') && cp /opt/unsloth-nb/unsloth_nb_compat.py "$SP/" && chmod +x /opt/unsloth-nb/unsloth_run.py
          EOF
          docker build -q -t unsloth-arm -f "$RUNNER_TEMP/Dockerfile.arm" docker/
          sha256sum docker/unsloth_run.py docker/run.sh

      - name: "Serve a notebook that saves with relative paths"
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/srv"
          cat > "$RUNNER_TEMP/srv/tiny.ipynb" <<'EOF'
          {"cells": [{"cell_type": "code", "execution_count": null, "metadata": {}, "outputs": [], "source": ["import os\n", "os.makedirs('lora_model', exist_ok=True)\n", "open('lora_model/adapter_config.json', 'w').write('{}')\n", "print('saved to', os.getcwd())"]}], "metadata": {"kernelspec": {"name": "python3", "display_name": "Python 3", "language": "python"}}, "nbformat": 4, "nbformat_minor": 5}
          EOF
          (cd "$RUNNER_TEMP/srv" && nohup python3 -m http.server 8765 --bind 0.0.0.0 >/dev/null 2>&1 &)
          sleep 2
          curl -fsS -o /dev/null http://172.17.0.1:8765/tiny.ipynb && echo served

      - name: "bash docker/run.sh unsloth-run <URL> from a project dir"
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj"
          set +e
          UNSLOTH_IMAGE=unsloth-arm UNSLOTH_GPUS=none UNSLOTH_ALLOW_CPU=1 bash "$GITHUB_WORKSPACE/docker/run.sh" unsloth-run http://172.17.0.1:8765/tiny.ipynb 2>&1 | grep -v NbConvertApp
          rc=${PIPESTATUS[0]}
          set -e
          echo "unsloth-run exit code: $rc"
          echo "project dir after the run:"; find . | sort | sed 's/^/  /'
          if [ "$rc" = 0 ] && [ -f tiny.ipynb ] && [ -f lora_model/adapter_config.json ]; then
            grep -o 'saved to [^\\"]*' tiny.ipynb | head -1
            echo 'PASS: executed notebook and lora_model/ are in the project dir'
          else
            echo 'FAIL: unsloth-run exited '"$rc"' and left no notebook or lora_model/ in the project dir'
            exit 1
          fi

      - name: "Adjacent: other commands still start in /workspace"
        shell: bash
        run: |
          cd "$RUNNER_TEMP/proj"
          out=$(UNSLOTH_IMAGE=unsloth-arm UNSLOTH_GPUS=none UNSLOTH_ALLOW_CPU=1 bash "$GITHUB_WORKSPACE/docker/run.sh" pwd | tail -1)
          echo "run.sh pwd -> $out"
          [ "$out" = /workspace ] && echo 'PASS: pwd is /workspace' || { echo 'FAIL: pwd changed'; exit 1; }

