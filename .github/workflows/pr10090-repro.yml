# PR 10090 reproduction. Three checkouts of the same tree; only
# studio/backend/routes/inference.py is swapped, so every difference in the
# printed values comes from that one file.
name: PR 10090 repro (Anthropic passthrough context overflow)

on:
  push:
    branches:
      - 'pr10090-repro-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base-before-pr
            sha: 2da377132c65b7580a658a95005693988d7f2515
            expect: 'raw llama-server error reaches the client'
          - variant: head-before-fix
            sha: 0eec0f2220aa07569e1f1949ffb7100858396f35
            expect: 'PR wording works, but KV starvation is swept into it (Codex P1)'
          - variant: head-inband-gap
            sha: 3f83a9c153f67f3dd57957dcf00fa7bee11f1b95
            expect: 'both non-stream P1s fixed, but in-band SSE still flattens to An internal error occurred'
          - variant: head-fixed
            sha: e18b32cedd462e7c1c5ff8f543a534a292612da3
            expect: 'PR wording works, KV starvation excluded, in-band SSE routed through the same formatter'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install deps (shared shape with the backend pytest job)
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install \
            python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests typer \
            'numpy<3' pytest pytest-asyncio pytest-xdist httpx
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            'torch>=2.4,<2.11' 'torchvision<0.26' 'torchaudio<2.11'
          pip install 'transformers>=4.51,<5.5'
          pip install 'bitsandbytes>=0.45'

      - name: Swap in the variant's inference.py (the only thing that differs)
        run: |
          git checkout ${{ matrix.sha }} -- studio/backend/routes/inference.py
          echo "variant : ${{ matrix.variant }}"
          echo "sha     : ${{ matrix.sha }}"
          echo "expect  : ${{ matrix.expect }}"
          git diff --stat HEAD -- studio/backend/routes/inference.py || true

      - name: Probe what the client is told
        run: python .github/repro/pr10090_probe.py

      - name: Assert this variant's expected outcome
        run: python .github/repro/pr10090_assert.py ${{ matrix.variant }}

      - name: PR regression tests (recorded, not gating)
        continue-on-error: true
        run: |
          cd studio/backend
          python -m pytest tests/test_openai_tool_passthrough.py -q \
            -k "anthropic_upstream_error or genuine_oversize" --tb=line || true
