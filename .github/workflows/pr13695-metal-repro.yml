# Disposable repro workflow. Delete after validation.

name: "PR 13695 Metal working set repro"

on:
  push:
    branches:
      - "pr13695-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "macos-15"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install backend deps and torch (no MLX yet)"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install psutil pytest pytest-timeout 'numpy<3' httpx pyyaml
          pip install 'torch>=2.5,<2.11'
          python -c "import torch; print('torch', torch.__version__, 'mps', torch.backends.mps.is_available())"

      - name: "Probe without MLX installed"
        shell: bash
        run: |
          python .github/pr13695/probe_metal.py no-mlx

      - name: "Install MLX"
        shell: bash
        run: |
          pip install 'mlx==0.32.3'
          python -c "import mlx.core as mx; print('mlx', mx.metal.is_available(), mx.device_info().get('max_recommended_working_set_size'))"

      - name: "Probe with MLX installed"
        shell: bash
        run: |
          python .github/pr13695/probe_metal.py with-mlx

      - name: "PR tests on a real Apple Silicon runner"
        shell: bash
        run: |
          cd studio/backend
          python -m pytest -q --tb=short --timeout=300 -rs tests/test_metal_working_set_sources_agree.py tests/test_llama_cpp_context_fit.py tests/test_metal_explicit_context_guard.py

